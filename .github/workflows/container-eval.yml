name: Container evaluation runtime

on:
  pull_request:
    paths:
      - "Dockerfile.eval"
      - ".dockerignore"
      - "docker/**"
      - "scripts/container_smoke_test.py"
      - "scripts/verify_container_image.sh"
      - "src/**"
      - "eval_cases/**"
      - "grasps/**"
      - "pyproject.toml"
      - ".github/workflows/container-eval.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.eval
          load: true
          push: false
          platforms: linux/amd64
          tags: grasp-eval:ci
          build-args: |
            CODE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime and one MuJoCo evaluation
        run: docker run --rm grasp-eval:ci
